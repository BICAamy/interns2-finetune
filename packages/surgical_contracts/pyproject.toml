[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-contracts"
version = "0.1.0"
description = "Versioned contracts shared by the surgical navigation services"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["surgical_contracts*"]

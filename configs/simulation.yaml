entry_point_env:
  tcp_name: needle_tip # 仿真逻辑名称；当前数值位置与法兰中心重合
  coordinate_frame: robot_base # 坐标默认以机器人底座坐标系表达
  time_step_s: 0.05 # 仿真控制每 0.05 秒推进一次
  default_speed_mm_s: 70.0 # 与真机 motion.speed_mm_s 一致
  maximum_speed_mm_s: 2000.0 # 与真机 limits.max_speed_mm_s 一致
  reach_tolerance_mm: 0.5 # 距目标 ≤ 0.5 mm 时，可以认为“到点”
  maximum_relative_distance_mm: 1000.0 # 与真机 limits.max_step_mm 一致
  default_relative_step_mm: 15.0 # “移动一点”时采用的距离
  default_relative_rotation_deg: 15.0 # “转动一点”时采用的角度
  default_rotation_joint_index: 1 # 未指定关节时转动 J1，可填 1～6
  joint_speed_deg_s: 15.0 # 关节相对旋转速度
  joint_acceleration_deg_s2: 30.0 # 关节相对旋转加速度
  maximum_rotation_deg: 720.0 # 与真机 limits.max_rotation_deg 一致
  trajectory_history_limit: 2048 # 最多保留 2048 个历史轨迹点

  # workspace是一个长方体，对应xyz三个方向；与当前真机配置保持一致
  workspace:
    low_mm: [100.0, -1000.0, 100.0]
    high_mm: [1000.0, 1000.0, 1500.0]

  robot:
    model_name: E05-Pro # 机器人名字
    force_control_variant: true
    source_repository: https://github.com/huayan-robotics/elfin_model # 机械臂几何参数提取的仓库源
    source_commit: 84baf18d37eefa46b6f092c7fa1f105f81f70ecb # 机械臂几何参数提取的版本号
    source_variant: 485/elfin5 

    # 机械臂零位时，从底座一路沿几何链算到力控法兰的尺寸组成是
    # 1204 mm total = 220 + 380 + 420 + 184 mm.
    force_flange_offset_mm: 184.0

    # 六个关节的角度范围
    joint_limits_deg:
      - [-360.0, 360.0]
      - [-135.0, 135.0]
      - [-153.0, 153.0]
      - [-360.0, 360.0]
      - [-180.0, 180.0]
      - [-360.0, 360.0]
    joint_max_speeds_deg_s: [180.0, 180.0, 180.0, 180.0, 200.0, 200.0] # 每个关节自己的最大旋转速度。

    # 仿真一启动，六个关节初始角度
    initial_joint_positions_deg: [0.0, 0.0, 60.0, 0.0, 90.0, 0.0]

    tool_transform:
      # 从机械臂法兰坐标系，到你安装的工具 TCP/针尖坐标系之间的固定刚体变换
      translation_mm: [0.0, 0.0, 0.0] # 当前统一假设针尖与法兰中心重合
      rpy_deg: [0.0, 0.0, 0.0] # 当前统一使用零旋转
      provisional: true # 安装真实工具后必须重新标定，不能继续沿用零偏移假设
      real_robot_motion_allowed: false # 仿真配置不能替代真机配置授权运动
      note: 当前无工具，临时按针尖与法兰中心重合；装针后重新标定
  # K 数值求解器的参数
  inverse_kinematics:
    orientation_weight_mm_per_rad: 100.0
    position_tolerance_mm: 0.05 # 要求最终 IK 的解算结果中，算的位置与目标结果位置误差小于0.05mm
    orientation_tolerance_deg: 0.05 # 要求最终 TCP 姿态误差 <= 0.05度
    maximum_solver_evaluations: 300 # 求解器最多允许尝试300次
  # 仿真图像大小
  image:
    height: 600
    width: 600
